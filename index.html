<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzaria Demo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
}

.secao{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 1px 4px rgba(0,0,0,.1);
}

h2{
color:#c62828;
margin-bottom:10px;
}

.produto{
border-bottom:1px solid #ddd;
padding:12px 0;
}

button{
background:#2e7d32;
color:white;
border:none;
padding:10px;
border-radius:5px;
cursor:pointer;
margin-top:5px;
}

.btn-voltar{
background:#666;
margin-bottom:15px;
}

.remover{
background:#c62828;
}

input,
select,
textarea{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
border:1px solid #ccc;
border-radius:5px;
}

textarea{
height:80px;
resize:none;
}

.oculto{
display:none;
}

.itemCarrinho{
border-bottom:1px dashed #ccc;
padding:10px 0;
}

#modal{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
padding:15px;
}

#modalBox{
background:white;
width:100%;
max-width:500px;
padding:15px;
border-radius:10px;
}

.fechar{
background:#666;
}

#total{
font-size:22px;
font-weight:bold;
color:#c62828;
}

#telaStatus{
display:none;
}

.statusBox{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 1px 4px rgba(0,0,0,.1);
}

#statusAtual{
font-size:24px;
font-weight:bold;
margin-top:10px;
margin-bottom:20px;
color:#c62828;
}

#resumoFinal{
white-space:pre-line;
line-height:1.6;
}

.controles{
display:flex;
gap:10px;
align-items:center;
margin-bottom:10px;
}

.controles button{
margin:0;
width:40px;
}

/* Estilo para as abas de navegação */
.abas-container {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.aba {
    flex: 1;
    padding: 10px;
    text-align: center;
    background: #ddd;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    color: #555;
}

.aba.ativa {
    background: #c62828;
    color: white;
}

</style>
</head>
<body>

<div id="telaPedido">

    <!-- Navegação por Abas para facilitar o fluxo -->
    <div class="abas-container">
        <div class="aba ativa" id="abaPizzas" onclick="irParaSecao('pizzas')">1. Pizzas</div>
        <div class="aba" id="abaBebidas" onclick="irParaSecao('bebidas')">2. Bebidas</div>
        <div class="aba" id="abaCarrinho" onclick="irParaSecao('dados')">3. Finalizar</div>
    </div>

    <!-- SEÇÃO 1: PIZZAS -->
    <div id="secaoPizzas" class="secao">
        <h2>Escolha sua Pizza</h2>
        <div id="listaPizzas">Carregando pizzas...</div>
    </div>

    <!-- SEÇÃO 2: BEBIDAS -->
    <div id="secaoBebidas" class="secao oculto">
        <button class="btn-voltar" onclick="irParaSecao('pizzas')">← Voltar para Pizzas</button>
        <h2>Escolha sua Bebida</h2>
        <div id="listaBebidas">Carregando bebidas...</div>
        <br>
        <button style="width:100%; background:#c62828; font-size:18px;" onclick="irParaSecao('dados')">Ir para o Carrinho →</button>
    </div>

    <!-- SEÇÃO 3: DADOS E CARRINHO -->
    <div id="secaoDados" class="secao oculto">
        <button class="btn-voltar" onclick="irParaSecao('bebidas')">← Voltar para Bebidas</button>
        
        <h2>Seu Carrinho</h2>
        <div id="carrinho">Nenhum item adicionado.</div>
        <br>
        <div id="total">R$ 0,00</div>

        <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">

        <h2>Dados do Cliente</h2>
        <label>Nome</label>
        <input id="nome">

        <label>Telefone</label>
        <input id="telefone">

        <label>Endereço</label>
        <input id="endereco">

        <label>Pagamento</label>
        <select id="pagamento">
            <option>Pix</option>
            <option>Cartão</option>
            <option>Dinheiro</option>
        </select>

        <label>
            <input type="checkbox" id="trocoCheck">
            Precisa de troco
        </label>

        <div id="trocoArea" class="oculto">
            <label>Troco para quanto?</label>
            <input id="trocoPara">
        </div>

        <button style="width:100%; height:50px; font-size:18px;" onclick="finalizarPedido()">
            Finalizar Pedido
        </button>
    </div>

</div>

<div id="telaStatus">
    <div class="statusBox">
        <h2 id="numeroPedido">Pedido #0001</h2>
        <div id="statusAtual">Pedido Recebido ✅</div>
        <div id="resumoFinal"></div>
        <br>
        <button onclick="location.reload()" style="background:#666; width:100%">Fazer Novo Pedido</button>
    </div>
</div>

<div id="modal">
    <div id="modalBox">
        <h2 id="tituloPizza"></h2>
        <label>Tipo</label>
        <select id="tipoPizza">
            <option value="inteira">Inteira</option>
            <option value="meia">Meio a Meio</option>
        </select>

        <div id="areaSegundoSabor" class="oculto">
            <label>Segundo Sabor</label>
            <select id="segundoSabor"></select>
        </div>

        <label>Quantidade</label>
        <input id="quantidadePizza" type="number" value="1" min="1">

        <label>Borda</label>
        <select id="bordaPizza">
            <option value="Sem borda">Sem borda</option>
            <option value="Catupiry">Catupiry (+5)</option>
            <option value="Cheddar">Cheddar (+5)</option>
            <option value="Chocolate">Chocolate (+8)</option>
        </select>

        <label>Observações</label>
        <textarea id="observacaoPizza" placeholder="Sem cebola, sem azeitona..."></textarea>

        <button onclick="confirmarPizza()">Adicionar ao Carrinho</button>
        <button class="fechar" onclick="fecharModal()">Cancelar</button>
    </div>
</div>

<script>

const url = "https://pkocqdyhhyfumuqublek.supabase.co";
const chave = "sb_publishable_NFBsbVhsyVOzDrQYhTA7cg_PR04G32-";

let produtos = [];
let carrinho = [];
let pizzaAtual = null;
let totalGeral = 0;

// Alternar visibilidade das seções
function irParaSecao(secao) {
    document.getElementById('secaoPizzas').classList.add('oculto');
    document.getElementById('secaoBebidas').classList.add('oculto');
    document.getElementById('secaoDados').classList.add('oculto');
    
    document.getElementById('abaPizzas').classList.remove('ativa');
    document.getElementById('abaBebidas').classList.remove('ativa');
    document.getElementById('abaCarrinho').classList.remove('ativa');

    if(secao === 'pizzas') {
        document.getElementById('secaoPizzas').classList.remove('oculto');
        document.getElementById('abaPizzas').classList.add('ativa');
    } else if(secao === 'bebidas') {
        document.getElementById('secaoBebidas').classList.remove('oculto');
        document.getElementById('abaBebidas').classList.add('ativa');
    } else if(secao === 'dados') {
        document.getElementById('secaoDados').classList.remove('oculto');
        document.getElementById('abaCarrinho').classList.add('ativa');
    }
    
    window.scrollTo(0,0);
}

document.getElementById("trocoCheck").addEventListener("change", function(){
    document.getElementById("trocoArea").classList.toggle("oculto", !this.checked);
});

document.getElementById("tipoPizza").addEventListener("change", function(){
    document.getElementById("areaSegundoSabor").classList.toggle("oculto", this.value !== "meia");
});

async function carregarProdutos(){
    try {
        const response = await fetch(`${url}/rest/v1/produtos?select=*`, {
            headers: {
                "apikey": chave,
                "Authorization": `Bearer ${chave}`
            }
        });
        
        if (!response.ok) throw new Error("Erro ao carregar produtos");
        
        produtos = await response.json();
        renderizarListaProdutos();
    } catch (error) {
        console.error(error);
        document.getElementById("listaPizzas").innerHTML = "Erro ao carregar o cardápio.";
    }
}

function renderizarListaProdutos(){
    let htmlPizzas = "";
    let htmlBebidas = "";

    produtos.forEach((p, i) => {
        let card = `
            <div class="produto">
                <b>${p.nome}</b><br>
                ${p.descricao}<br><br>
                R$ ${p.preco.toFixed(2)}<br>
                ${p.categoria === "Pizza" 
                    ? `<button onclick="abrirPizza(${i})">Escolher</button>` 
                    : `<button onclick="addBebida(${i})">Adicionar</button>`
                }
            </div>
        `;

        if(p.categoria === "Pizza") {
            htmlPizzas += card;
        } else {
            htmlBebidas += card;
        }
    });

    document.getElementById("listaPizzas").innerHTML = htmlPizzas || "Nenhuma pizza disponível.";
    document.getElementById("listaBebidas").innerHTML = htmlBebidas || "Nenhuma bebida disponível.";
}

function abrirPizza(index){
    pizzaAtual = produtos[index];
    document.getElementById("tituloPizza").innerText = pizzaAtual.nome;
    document.getElementById("quantidadePizza").value = 1;
    document.getElementById("bordaPizza").value = "Sem borda";
    document.getElementById("observacaoPizza").value = "";

    const select = document.getElementById("segundoSabor");
    select.innerHTML = "";
    produtos.filter(p => p.categoria === "Pizza" && p.nome !== pizzaAtual.nome).forEach(p => {
        select.innerHTML += `<option value="${p.nome}">${p.nome}</option>`;
    });

    document.getElementById("tipoPizza").value = "inteira";
    document.getElementById("areaSegundoSabor").classList.add("oculto");
    document.getElementById("modal").style.display = "flex";
}

function fecharModal(){
    document.getElementById("modal").style.display = "none";
}

function confirmarPizza(){
    const tipo = document.getElementById("tipoPizza").value;
    const obs = document.getElementById("observacaoPizza").value;
    const quantidade = parseInt(document.getElementById("quantidadePizza").value) || 1;
    const borda = document.getElementById("bordaPizza").value;

    let valorBorda = 0;
    if(borda === "Catupiry" || borda === "Cheddar") valorBorda = 5;
    if(borda === "Chocolate") valorBorda = 8;

    const precoFinal = (pizzaAtual.preco + valorBorda) * quantidade;

    let item = {
        tipo: "pizza",
        modo: tipo,
        sabor1: pizzaAtual.nome,
        sabor2: tipo === "meia" ? document.getElementById("segundoSabor").value : "",
        observacao: obs,
        quantidade: quantidade,
        borda: borda,
        preco: precoFinal
    };

    carrinho.push(item);
    fecharModal();
    renderizarCarrinho();
    
    // NOVIDADE: Ao confirmar a pizza, vai automaticamente para as bebidas
    irParaSecao('bebidas');
}

function addBebida(index){
    const bebida = produtos[index];
    const existente = carrinho.find(item => item.tipo === "bebida" && item.nome === bebida.nome);

    if(existente){
        existente.quantidade++;
        existente.precoTotal = existente.quantidade * existente.precoUnitario;
    } else {
        carrinho.push({
            tipo: "bebida",
            nome: bebida.nome,
            quantidade: 1,
            precoUnitario: bebida.preco,
            precoTotal: bebida.preco
        });
    }

    renderizarCarrinho();
}

function removerItem(index){
    carrinho.splice(index,1);
    renderizarCarrinho();
}

function alterarQuantidadeBebida(index,valor){
    carrinho[index].quantidade += valor;
    if(carrinho[index].quantidade <= 0){
        carrinho.splice(index,1);
    } else {
        carrinho[index].precoTotal = carrinho[index].quantidade * carrinho[index].precoUnitario;
    }
    renderizarCarrinho();
}

function renderizarCarrinho(){
    const area = document.getElementById("carrinho");
    if(carrinho.length === 0){
        area.innerHTML = "Nenhum item adicionado.";
        document.getElementById("total").innerText = "R$ 0,00";
        totalGeral = 0;
        return;
    }

    area.innerHTML = "";
    totalGeral = 0;

    carrinho.forEach((item, index) => {
        let html = "";
        if(item.tipo === "pizza"){
            html = `
                <div class="itemCarrinho">
                    <b>${item.quantidade}x Pizza</b><br>
                    ${item.modo === "meia" ? `${item.sabor1} / ${item.sabor2}` : item.sabor1}<br>
                    Borda: ${item.borda}
                    ${item.observacao ? `<br>Obs: ${item.observacao}` : ""}
                    <br>R$ ${item.preco.toFixed(2)}<br>
                    <button class="remover" onclick="removerItem(${index})">Remover</button>
                </div>
            `;
            totalGeral += item.preco;
        } else {
            html = `
                <div class="itemCarrinho">
                    <b>${item.nome}</b><br>
                    <div class="controles">
                        <button onclick="alterarQuantidadeBebida(${index},-1)">-</button>
                        <span>${item.quantidade}</span>
                        <button onclick="alterarQuantidadeBebida(${index},1)">+</button>
                    </div>
                    R$ ${item.precoTotal.toFixed(2)}<br>
                    <button class="remover" onclick="removerItem(${index})">Remover</button>
                </div>
            `;
            totalGeral += item.precoTotal;
        }
        area.innerHTML += html;
    });

    document.getElementById("total").innerText = "R$ " + totalGeral.toFixed(2);
}

function atualizarStatusPedido(){
    setTimeout(() => { document.getElementById("statusAtual").innerText = "Preparando 🍕"; }, 5000);
    setTimeout(() => { document.getElementById("statusAtual").innerText = "Saiu para Entrega 🛵"; }, 10000);
    setTimeout(() => { document.getElementById("statusAtual").innerText = "Entregue 🎉"; }, 15000);
}

function finalizarPedido(){
    if(carrinho.length === 0){
        alert("Adicione itens ao carrinho");
        return;
    }

    const nome = document.getElementById("nome").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const endereco = document.getElementById("endereco").value.trim();

    if(!nome || !telefone || !endereco){
        alert("Preencha nome, telefone e endereço.");
        return;
    }

    const pagamento = document.getElementById("pagamento").value;
    let resumo = "";

    carrinho.forEach(item => {
        if(item.tipo === "pizza"){
            resumo += `${item.quantidade}x Pizza\n${item.modo === "meia" ? item.sabor1 + " / " + item.sabor2 : item.sabor1}\nBorda: ${item.borda}\n${item.observacao ? "Obs: " + item.observacao + "\n" : ""}R$ ${item.preco.toFixed(2)}\n\n`;
        } else {
            resumo += `${item.quantidade}x ${item.nome}\nR$ ${item.precoTotal.toFixed(2)}\n\n`;
        }
    });

    let numeroPedido = Math.floor(1000 + Math.random() * 9000);
    let mensagem = `Pedido #${numeroPedido}\n\nCliente: ${nome}\n\nTelefone: ${telefone}\n\nEndereço: ${endereco}\n\n${resumo}\nTOTAL: R$ ${totalGeral.toFixed(2)}\n\nPagamento: ${pagamento}\n`;

    if(document.getElementById("trocoCheck").checked){
        mensagem += `Troco para: R$ ${document.getElementById("trocoPara").value}\n`;
    }

    document.getElementById("telaPedido").style.display = "none";
    document.getElementById("telaStatus").style.display = "block";
    document.getElementById("numeroPedido").innerText = "Pedido #" + numeroPedido;
    document.getElementById("resumoFinal").innerText = mensagem;
    atualizarStatusPedido();
}

carregarProdutos();

</script>

</body>
</html>
